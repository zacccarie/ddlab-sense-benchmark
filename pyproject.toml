[project]
name = "ddlab-sense-benchmark"
version = "0.1.0"
description = "DDLab-grounded benchmark: does a model recover the causal structure (basins, attractors, garden-of-Eden) of a discrete dynamical system?"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddlab_bench"]
